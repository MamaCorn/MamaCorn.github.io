<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07061a">
<title>Dananga</title>
<style>
  :root{
    --bg1:#030210; --bg2:#070620; --ink:#f4efe6; --muted:#a9a3c4;
    --gold:#f2b84b; --rose:#ff5d8f; --teal:#3fd0c9; --violet:#8b6cff;
    --glass:rgba(255,255,255,.045); --stroke:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;background:var(--bg1);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  body{background:radial-gradient(120% 80% at 50% -10%,#16104a 0%,var(--bg2) 40%,var(--bg1) 72%);overflow-x:hidden}
  canvas#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .aurora{position:fixed;inset:-20% -20% auto;height:70vh;z-index:0;pointer-events:none;filter:blur(70px);opacity:.28;
    background:conic-gradient(from 180deg at 50% 50%,var(--violet),var(--rose),var(--gold),var(--teal),var(--violet));
    animation:spin 28s linear infinite;mask:radial-gradient(closest-side,#000 30%,transparent 75%)}
  @keyframes spin{to{transform:rotate(360deg)}}

  main{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:56px 16px 48px}

  .hero{text-align:center}
  .ring{position:relative;width:148px;height:148px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center}
  .ring::before{content:"";position:absolute;inset:0;border-radius:50%;padding:3px;
    background:conic-gradient(var(--gold),var(--rose),var(--violet),var(--teal),var(--gold));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
    animation:spin 6s linear infinite}
  .ring::after{content:"";position:absolute;inset:-18px;border-radius:50%;z-index:-1;
    background:radial-gradient(circle,rgba(242,184,75,.22),transparent 65%);animation:pulse 4s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.08);opacity:.6}}
  .avatar{width:132px;height:132px;border-radius:50%;object-fit:cover;background:#1a1450;
    display:grid;place-items:center;font-size:56px;font-weight:800;color:var(--gold)}

  h1{font-size:40px;letter-spacing:.5px;font-weight:800;
    background:linear-gradient(90deg,var(--ink),var(--gold),var(--rose),var(--ink));background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
  @keyframes shine{to{background-position:300% 0}}
  .handle{margin-top:6px;color:var(--muted);font-size:15px;display:inline-flex;gap:6px;align-items:center}
  .handle .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal)}
  .bio{margin:14px auto 0;max-width:320px;color:#d8d2ea;font-size:15px;line-height:1.45}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 0 30px}
  .btn{display:flex;align-items:center;justify-content:center;gap:9px;height:54px;border-radius:18px;
    font-weight:700;font-size:16px;color:var(--ink);text-decoration:none;border:1px solid var(--stroke);
    background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;
    transition:transform .15s ease,background .2s}
  .btn{color:#b9b4cc;transition:transform .15s ease,color .25s,border-color .25s,box-shadow .25s,background .25s}
  .btn:hover,.btn:focus-visible{color:#fff;border-color:transparent;outline:none;
    background:linear-gradient(135deg,var(--rose),var(--violet));box-shadow:0 10px 30px -10px rgba(255,93,143,.7)}
  #tipBtn:hover,#tipBtn:focus-visible{background:linear-gradient(135deg,var(--gold),#e07b2e);box-shadow:0 10px 30px -10px rgba(242,184,75,.6)}
  .btn:active{transform:scale(.96)}
  .btn svg{width:20px;height:20px}

  .section{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:0 4px 12px}
  .links{display:flex;flex-direction:column;gap:12px}
  .card{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;
    text-decoration:none;color:var(--ink);background:var(--glass);border:1px solid var(--stroke);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:hidden;
    opacity:0;transform:translateY(14px);animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards;transition:transform .15s}
  .card:active{transform:scale(.98)}
  .card::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.09) 50%,transparent 70%);
    transform:translateX(-100%);animation:sweep 5s ease-in-out infinite}
  @keyframes sweep{60%,100%{transform:translateX(100%)}}
  @keyframes rise{to{opacity:1;transform:none}}
  .ico{flex:none;width:46px;height:46px;border-radius:14px;object-fit:cover;background:#111;
    box-shadow:0 0 0 1px rgba(255,255,255,.12)}
  .txt{flex:1;min-width:0}
  .txt b{display:block;font-size:17px}
  .txt span{display:block;font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arrow{opacity:.5;font-size:20px}

  footer{margin-top:36px;text-align:center;color:var(--muted);font-size:12px;letter-spacing:1px}
  footer b{color:var(--teal);font-weight:600}

  /* tip sheet */
  .veil{position:fixed;inset:0;z-index:5;background:rgba(3,2,15,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .25s}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:460px;margin:0 auto;padding:10px 16px 28px;
    border-radius:26px 26px 0 0;background:#14113a;border:1px solid var(--stroke);border-bottom:none;
    transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  .open .veil{opacity:1;pointer-events:auto}
  .open .sheet{transform:none}
  .grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 16px}
  .sheet h2{font-size:22px;text-align:center}
  .sheet p{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 18px}
  .amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .amt{height:64px;border-radius:16px;border:1px solid var(--stroke);background:var(--glass);color:var(--ink);
    font-size:18px;font-weight:800;text-decoration:none;display:grid;place-items:center}
  .amt small{display:block;font-size:11px;color:var(--muted);font-weight:600}
  .addr{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.25);
    font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#d8d2ea;word-break:break-all;cursor:pointer}
  .addr i{font-style:normal;color:var(--gold);font-family:inherit;white-space:nowrap}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
</style>
</head>

/* ================================================== */

const $ = id => document.getElementById(id);
$("name").textContent = CONFIG.name; document.title = CONFIG.name;
$("handle").textContent = CONFIG.handle;
$("msg").href = CONFIG.telegram;

// аватар: если avatar.jpg нет — монограмма
$("av").onerror = function(){
  const d = document.createElement("div"); d.className = "avatar"; d.textContent = CONFIG.name[0];
  this.replaceWith(d);
};

// ссылки
CONFIG.links.forEach((l,i)=>{
  const a = document.createElement("a");
  a.className = "card"; a.href = l.url; a.target = "_blank"; a.rel = "noopener";
  a.style.animationDelay = (0.15 + i*0.09) + "s";
  a.innerHTML = `<img class="ico" src="${l.icon}" alt="">
    <div class="txt"><b></b><span></span></div><div class="arrow">›</div>`;
  a.querySelector("b").textContent = l.title;
  a.querySelector("span").textContent = l.sub;
  $("links").appendChild(a);
});

// чаевые
CONFIG.tips.forEach(t=>{
  const a = document.createElement("a"); a.className = "amt";
  a.href = `ton://transfer/${CONFIG.wallet}?amount=${t*1e9}`;
  a.innerHTML = `<div>${t}<small>TON</small></div>`;
  $("amounts").appendChild(a);
});
$("addrText").textContent = CONFIG.wallet;
const tip = $("tip");
$("tipBtn").onclick = () => tip.classList.add("open");
$("veil").onclick = () => tip.classList.remove("open");
$("addr").onclick = async () => {
  try { await navigator.clipboard.writeText(CONFIG.wallet); $("copyLbl").textContent = "copied ✓"; }
  catch(e){ $("copyLbl").textContent = "long-press to copy"; }
  setTimeout(()=>$("copyLbl").textContent="copy",2000);
};

// звёздное небо с созвездиями
(function(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("sky"), x = c.getContext("2d");
  let W,H,dpr,stars=[];
  function size(){
    dpr = Math.min(devicePixelRatio||1,2);
    W = c.width = innerWidth*dpr; H = c.height = innerHeight*dpr;
    const n = Math.round(innerWidth*innerHeight/9000);
    stars = Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,
      r:(Math.random()*1.4+.3)*dpr,vx:(Math.random()-.5)*.12*dpr,vy:(Math.random()-.5)*.12*dpr,
      p:Math.random()*Math.PI*2,g:["#f2b84b","#ff5d8f","#3fd0c9","#ffffff"][Math.random()*4|0]}));
  }
  addEventListener("resize",size); size();
  const L = 110;
  (function draw(t){
    x.clearRect(0,0,W,H);
    for(const s of stars){
      s.x=(s.x+s.vx+W)%W; s.y=(s.y+s.vy+H)%H;
      x.globalAlpha=.3+.3*Math.sin(t/900+s.p);
      x.fillStyle=s.g; x.beginPath(); x.arc(s.x,s.y,s.r,0,7); x.fill();
    }
    x.strokeStyle="#8b6cff"; x.lineWidth=.6*dpr;
    for(let i=0;i<stars.length;i++)for(let j=i+1;j<stars.length;j++){
      const a=stars[i],b=stars[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);
      if(d<L*dpr){x.globalAlpha=(1-d/(L*dpr))*.2;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();}
    }
    requestAnimationFrame(draw);
  })(0);
})();
</script>
