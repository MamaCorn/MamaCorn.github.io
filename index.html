<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020109">
<title>Dananga</title>
<style>
  :root{
    --bg1:#020109; --bg2:#050414; --ink:#f1ece4; --muted:#8f8aa6; --dim:#6c6782;
    --gold:#f2b84b; --rose:#ff5d8f; --teal:#3fd0c9; --violet:#8b6cff;
    --glass:rgba(255,255,255,.035); --glass2:rgba(255,255,255,.055); --stroke:rgba(255,255,255,.075);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;background:var(--bg1);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  body{background:radial-gradient(110% 60% at 50% -8%,#0f0a33 0%,var(--bg2) 45%,var(--bg1) 70%);overflow-x:hidden}
  canvas#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .aurora{position:fixed;inset:-25% -20% auto;height:55vh;z-index:0;pointer-events:none;filter:blur(80px);opacity:.16;
    background:conic-gradient(from 180deg at 50% 50%,var(--violet),var(--rose),var(--gold),var(--teal),var(--violet));
    animation:spin 32s linear infinite;mask:radial-gradient(closest-side,#000 30%,transparent 75%)}
  @keyframes spin{to{transform:rotate(360deg)}}

  main{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:34px 16px 40px}

  .hero{text-align:center}
  .ring{position:relative;width:104px;height:104px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center}
  .ring::before{content:"";position:absolute;inset:0;border-radius:50%;padding:2px;
    background:conic-gradient(var(--gold),var(--rose),var(--violet),var(--teal),var(--gold));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
    animation:spin 6s linear infinite}
  .ring::after{content:"";position:absolute;inset:-14px;border-radius:50%;z-index:-1;
    background:radial-gradient(circle,rgba(242,184,75,.16),transparent 65%);animation:pulse 4s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.08);opacity:.6}}
  .avatar{width:94px;height:94px;border-radius:50%;object-fit:cover;background:#100c2e}

  h1{font-size:23px;letter-spacing:.6px;font-weight:800;
    background:linear-gradient(90deg,var(--ink),var(--gold),var(--rose),var(--ink));background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
  @keyframes shine{to{background-position:300% 0}}
  .handle{margin-top:6px;color:var(--muted);font-size:13.5px;display:inline-flex;gap:7px;align-items:center;text-decoration:none;
    padding:6px 12px;border-radius:999px;border:1px solid transparent;transition:color .25s,background .25s,border-color .25s}
  .handle svg{width:13px;height:13px;opacity:.7}
  .handle:hover,.handle:active{color:#fff;background:rgba(255,255,255,.06);border-color:var(--stroke)}
  .hero{margin-bottom:22px}
  .handle .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal)}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 20px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:15px;
    font-weight:700;font-size:15px;color:#a9a4bd;text-decoration:none;border:1px solid var(--stroke);
    background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;font-family:inherit;
    transition:transform .15s ease,color .25s,border-color .25s,box-shadow .25s,background .25s}
  .btn:hover,.btn:focus-visible{color:#fff;border-color:transparent;outline:none;
    background:linear-gradient(135deg,var(--rose),var(--violet));box-shadow:0 10px 30px -12px rgba(255,93,143,.6)}
  #tipBtn:hover,#tipBtn:focus-visible{background:linear-gradient(135deg,var(--gold),#e07b2e);box-shadow:0 10px 30px -12px rgba(242,184,75,.55)}
  .btn:active{transform:scale(.96)}
  .btn svg{width:18px;height:18px}

  .section{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:0 4px 10px}
  .links{display:flex;flex-direction:column;gap:9px}

  /* project card */
  .proj{position:relative;border-radius:18px;background:var(--glass);border:1px solid var(--stroke);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:hidden;
    opacity:0;transform:translateY(12px);animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards;transition:border-color .3s,background .3s}
  .proj.open{background:var(--glass2);border-color:rgba(255,255,255,.13)}
  @keyframes rise{to{opacity:1;transform:none}}
  .head{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;
    background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;overflow:hidden}
  .head::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.06) 50%,transparent 70%);
    transform:translateX(-100%);animation:sweep 6s ease-in-out infinite}
  .proj.open .head::before{display:none}
  @keyframes sweep{60%,100%{transform:translateX(100%)}}
  .ico{flex:none;width:40px;height:40px;border-radius:12px;object-fit:cover;background:#111;box-shadow:0 0 0 1px rgba(255,255,255,.1)}
  .mono{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
  .txt{flex:1;min-width:0}
  .txt b{display:block;font-size:16px}
  .txt span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tog{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);
    background:rgba(255,255,255,.05);transition:transform .35s cubic-bezier(.2,.8,.2,1),background .3s,color .3s}
  .tog svg{width:14px;height:14px}
  .proj.open .tog{transform:rotate(45deg);background:rgba(255,93,143,.18);color:#fff}

  .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1)}
  .proj.open .body{grid-template-rows:1fr}
  .body>div{overflow:hidden}
  .sub{display:flex;flex-direction:column;gap:2px;padding:0 10px 10px 10px}
  .sub::before{content:"";display:block;height:1px;margin:0 4px 6px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
  .row{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;color:var(--ink);text-decoration:none;
    font-size:14px;transition:background .2s;opacity:0;transform:translateY(-4px)}
  .proj.open .row{opacity:1;transform:none;transition:background .2s,opacity .35s ease,transform .35s ease}
  .row:hover,.row:active{background:rgba(255,255,255,.06)}
  .row .k{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:#cfc9e3}
  .row .k svg{width:15px;height:15px}
  .row .l{flex:1;min-width:0}
  .row .l small{display:block;font-size:11.5px;color:var(--dim);margin-top:1px}
  .row .go{color:var(--dim);font-size:16px}
  .tag{font-size:10.5px;font-weight:700;letter-spacing:.5px;padding:3px 7px;border-radius:7px;background:rgba(242,184,75,.14);color:var(--gold)}
  .tag.ref{background:rgba(63,208,201,.12);color:var(--teal)}
  .row.soon{opacity:.55!important;pointer-events:none}
  .swaps{display:flex;gap:6px}
  .swaps a{font-size:12px;font-weight:700;text-decoration:none;color:var(--ink);padding:6px 10px;border-radius:9px;
    background:rgba(255,255,255,.07);border:1px solid var(--stroke);transition:background .2s}
  .swaps a:hover{background:rgba(255,255,255,.14)}
  .swaps a .s{color:var(--teal)}

  .soonwrap{margin-top:18px}
  .soonlist{display:flex;flex-direction:column;gap:9px}
  .proj.soonp{border-style:dashed;border-color:rgba(255,255,255,.1)}
  .proj.soonp .head{text-decoration:none;cursor:default}
  a.proj.soonp{display:block;text-decoration:none;color:inherit}
  a.proj.soonp .head{cursor:pointer}
  .proj.soonp .ico{opacity:.92}
  .chip{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px 11px;border-radius:16px;text-decoration:none;color:var(--ink);
    background:var(--glass);border:1px dashed rgba(255,255,255,.11);font-size:13px;font-weight:700;
    opacity:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards}
  .chip small{font-size:10.5px;font-weight:600;color:var(--dim)}
  .chip .mono{width:34px;height:34px;font-size:15px;border-radius:11px}
  a.chip:hover{border-color:rgba(255,255,255,.22)}

  /* tip sheet */
  .veil{position:fixed;inset:0;z-index:5;background:rgba(1,1,8,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .25s}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:440px;margin:0 auto;padding:10px 16px 26px;
    border-radius:24px 24px 0 0;background:#0c0a24;border:1px solid var(--stroke);border-bottom:none;
    transform:translateY(110%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s}
  .open-tip .veil{opacity:1;pointer-events:auto}
  .open-tip .sheet{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s}
  .grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin:0 auto 14px}
  .sheet h2{font-size:20px;text-align:center}
  .sheet p{text-align:center;color:var(--muted);font-size:13.5px;margin:5px 0 16px}
  .amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:11px}
  .amt{height:58px;border-radius:15px;border:1px solid var(--stroke);background:var(--glass2);color:var(--ink);
    font-size:17px;font-weight:800;text-decoration:none;display:grid;place-items:center;text-align:center}
  .amt small{display:block;font-size:10.5px;color:var(--muted);font-weight:600}
  .addr{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:13px;background:rgba(0,0,0,.3);
    font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#cfc9e3;word-break:break-all;cursor:pointer}
  .addr i{font-style:normal;color:var(--gold);font-family:inherit;white-space:nowrap}


  /* donate */
  .donate{margin-top:16px;padding:14px;border-radius:18px;background:var(--glass);border:1px solid var(--stroke);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) .6s forwards}
  .donate h3{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
  .donate h3 svg{width:17px;height:17px;color:var(--gold)}
  .donate p{font-size:12.5px;color:var(--muted);margin:3px 0 12px}
  .dform{display:flex;justify-content:center}
  .field{flex:1;min-width:0;display:flex;align-items:center;height:46px;padding:0 14px;border-radius:14px;
    background:rgba(0,0,0,.35);border:1px solid var(--stroke);transition:border-color .2s,box-shadow .2s}
  .field:focus-within{border-color:rgba(242,184,75,.55);box-shadow:0 0 0 3px rgba(242,184,75,.12)}
  .field input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font:inherit;font-size:17px;font-weight:700}
  .field input::placeholder{color:var(--dim);font-weight:600}
  .field span{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.5px}
  .dbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--stroke);background:rgba(255,255,255,.06);
    color:#a9a4bd;font:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:color .25s,background .25s,box-shadow .25s,border-color .25s,transform .15s}
  .dbtn:hover,.dbtn:focus-visible{color:#1a1206;border-color:transparent;outline:none;background:linear-gradient(135deg,var(--gold),#e07b2e);box-shadow:0 10px 26px -12px rgba(242,184,75,.6)}
  .dbtn:active{transform:scale(.96)}
  .dbtn svg{width:17px;height:17px}
  .dbtn.main{flex:none;min-width:170px}
  #chatBtn:hover,#chatBtn:focus-visible{color:#fff;background:linear-gradient(135deg,var(--rose),var(--violet));box-shadow:0 10px 26px -12px rgba(255,93,143,.6)}
  .hint{font-size:11.5px;color:var(--dim);margin-top:9px;text-align:center}
  .hint b{color:var(--muted)}
  .field.err{border-color:rgba(255,93,143,.7);animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .addr{display:flex;align-items:center;justify-content:center;text-align:center;gap:10px;margin-top:10px;padding:9px 12px;border-radius:12px;background:rgba(0,0,0,.25);
    font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--dim);word-break:break-all;cursor:pointer}
  .addr i{font-style:normal;color:var(--gold);white-space:nowrap;font-family:inherit}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.proj,.chip,.donate{opacity:1;transform:none}}
</style>
</head>

function rowHTML(it, i){
  const d = `style="transition-delay:${(i*0.04).toFixed(2)}s"`;
  if (it.type === "swap") {
    return `<div class="row" ${d}><div class="k">${ICONS.swap}</div>
      <div class="l">${esc(it.label)}<small>swap from GRAM</small></div>
      <div class="swaps"><a href="${ston(it.jetton)}" target="_blank" rel="noopener">STON.fi <span class="s">★</span></a>
      <a href="${dedust(it.jetton)}" target="_blank" rel="noopener">DeDust</a></div></div>`;
  }
  const soon = !it.url;
  const tag = soon ? '<span class="tag">SOON</span>' : (it.ref ? '<span class="tag ref">REF</span>' : '<span class="go">›</span>');
  return `<a class="row${soon?' soon':''}" ${d} ${soon?'':`href="${esc(it.url)}" target="_blank" rel="noopener"`}>
    <div class="k">${ICONS[it.type]||ICONS.site}</div>
    <div class="l">${esc(it.label)}<small>${esc(it.note||"")}</small></div>${tag}</a>`;
}

CONFIG.projects.forEach((p, i) => {
  const el = document.createElement("div");
  el.className = "proj"; el.style.animationDelay = (0.1 + i*0.07) + "s";
  el.innerHTML = `<button class="head" aria-expanded="false">
      <img class="ico" src="${p.icon}" alt="">
      <div class="txt"><b>${esc(p.title)}</b><span>${esc(p.sub)}</span></div>
      <div class="tog">${PLUS}</div></button>
    <div class="body"><div><div class="sub">${p.items.map(rowHTML).join("")}</div></div></div>`;
  const head = el.querySelector(".head");
  head.onclick = () => {
    const open = !el.classList.contains("open");
    document.querySelectorAll(".proj.open").forEach(o => { if (o !== el) { o.classList.remove("open"); o.querySelector(".head").setAttribute("aria-expanded","false"); }});
    el.classList.toggle("open", open); head.setAttribute("aria-expanded", open);
  };
  $("links").appendChild(el);
});

CONFIG.soon.forEach((s, i) => {
  const el = document.createElement(s.url ? "a" : "div");
  el.className = "proj soonp"; el.style.animationDelay = (0.4 + i*0.07) + "s";
  if (s.url) { el.href = s.url; el.target = "_blank"; el.rel = "noopener"; }
  el.innerHTML = `<div class="head"><img class="ico" src="${s.icon}" alt="">
    <div class="txt"><b>${esc(s.title)}</b><span>${esc(s.sub)}</span></div><span class="tag">SOON</span></div>`;
  $("links").appendChild(el);
});

// звёздное небо
(function(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("sky"), x = c.getContext("2d");
  let W,H,dpr,stars=[];
  function size(){
    dpr = Math.min(devicePixelRatio||1,2);
    W = c.width = innerWidth*dpr; H = c.height = innerHeight*dpr;
    const n = Math.round(innerWidth*innerHeight/10000);
    stars = Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,
      r:(Math.random()*1.3+.3)*dpr,vx:(Math.random()-.5)*.1*dpr,vy:(Math.random()-.5)*.1*dpr,
      p:Math.random()*Math.PI*2,g:["#f2b84b","#ff5d8f","#3fd0c9","#ffffff"][Math.random()*4|0]}));
  }
  addEventListener("resize",size); size();
  const L = 100;
  (function draw(t){
    x.clearRect(0,0,W,H);
    for(const s of stars){
      s.x=(s.x+s.vx+W)%W; s.y=(s.y+s.vy+H)%H;
      x.globalAlpha=.22+.22*Math.sin(t/900+s.p);
      x.fillStyle=s.g; x.beginPath(); x.arc(s.x,s.y,s.r,0,7); x.fill();
    }
    x.strokeStyle="#8b6cff"; x.lineWidth=.6*dpr;
    for(let i=0;i<stars.length;i++)for(let j=i+1;j<stars.length;j++){
      const a=stars[i],b=stars[j],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<L*dpr){x.globalAlpha=(1-d/(L*dpr))*.14;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();}
    }
    requestAnimationFrame(draw);
  })(0);
})();
</script>
